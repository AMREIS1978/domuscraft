<!DOCTYPE html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>DOMUSCRAFT</title><style>
*{box-sizing:border-box}body{margin:0;background:#101b24;color:#edf4f7;font:14px system-ui,sans-serif}header{padding:12px 16px;background:#192d39;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{margin:0;font-size:19px;letter-spacing:1px}h1 span{color:#5ce0c8}main{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100dvh - 57px)}aside{background:#192d39;padding:14px;overflow:auto}button,select{font:inherit;border:1px solid #426071;border-radius:9px;background:#294657;color:white;padding:10px;cursor:pointer}button.active{background:#0b9484;border-color:#5ce0c8}button:active{transform:scale(.97)}.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.tools button{min-height:46px}.wide{width:100%;margin:7px 0}select{width:100%;margin:8px 0}#scene{display:block;width:100%;height:100%;min-height:440px;touch-action:none;background:linear-gradient(#203b4d,#142531)}#status{padding:10px 0;line-height:1.8;color:#d1e6ed}small{color:#a9bfca}.hint{margin:10px 0;color:#bcd0d7}.workspace{position:relative;min-height:440px}.overlay{position:absolute;bottom:12px;left:12px;background:#10222bcc;padding:8px 12px;border-radius:8px;pointer-events:none}@media(max-width:750px){main{display:flex;flex-direction:column-reverse}aside{padding:10px}.tools{grid-template-columns:repeat(4,1fr)}.tools button{font-size:12px;padding:8px 3px}.workspace{min-height:390px}#scene{min-height:390px;height:48dvh}header{padding:10px}h1{font-size:16px}}
</style></head><body><header><h1>DOMUS<span>CRAFT</span></h1><span id="title">O teu estaleiro</span></header><main><aside><b>1 · Escolhe o que construir</b><div class="tools" id="tools"></div><div class="hint">Toca numa quadrícula para construir. Arrasta o terreno para o rodar.</div><b>2 · Projeto</b><select id="typ"><option value="1">T1 · Casa pequena</option><option value="2" selected>T2 · Casa familiar</option><option value="3">T3 · Casa ampla</option><option value="4">T4 · Casa grande</option></select><button class="wide" id="starter">Gerar base da casa</button><button class="wide" id="roof">Colocar / retirar cobertura</button><button class="wide" id="undo">↶ Desfazer</button><button class="wide" id="save">Guardar no dispositivo</button><button class="wide" id="reset">Novo terreno</button><div id="status"></div><small>Protótipo jogável: valores ilustrativos. Não é um projeto técnico de arquitetura.</small></aside><section class="workspace"><svg id="scene" viewBox="0 0 900 660" role="img" aria-label="Terreno de construção interativo"></svg><div class="overlay" id="info">Seleciona um elemento e toca no terreno</div></section></main><script>
const $=id=>document.getElementById(id),N=10,prices={foundation:600,wall:480,door:780,window:650,floor:120,remove:0},labels={foundation:'🧱 Fundação',wall:'🏗️ Parede',door:'🚪 Porta',window:'🪟 Janela',floor:'▦ Pavimento',remove:'⌫ Demolir'};let cells=Array.from({length:N*N},()=>({base:false,wall:false,door:false,window:false,floor:false})),tool='foundation',angle=0,roof=false,history=[],money=0,drag=null;
function snapshot(){history.push(JSON.stringify({cells,roof,money}));if(history.length>40)history.shift()}
function point(x,y,z=0){let a=(angle+40)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return [450+(x*c-y*s)*24,300+(x*s+y*c)*12-z*26]}
function poly(pts,color,extra=''){return '<polygon points="'+pts.map(p=>point(...p).join(',')).join(' ')+'" fill="'+color+'" stroke="#28444c" stroke-width="1.5" '+extra+'/>'}
function cellShape(x,y,z,color,extra=''){return poly([[x,y,z],[x+1,y,z],[x+1,y+1,z],[x,y+1,z]],color,extra)}
function block(x,y,z,h,col){return poly([[x,y,z],[x+1,y,z],[x+1,y,z+h],[x,y,z+h]],col)+poly([[x+1,y,z],[x+1,y+1,z],[x+1,y+1,z+h],[x+1,y,z+h]],'#a4b7b8')}
function render(){let out='<rect width="900" height="660" fill="#1a3242"/>';out+=poly([[-1,-1,-.4],[11,-1,-.4],[11,11,-.4],[-1,11,-.4]],'#52735c');let order=[];for(let y=0;y<N;y++)for(let x=0;x<N;x++)order.push({x,y,depth:point(x+.5,y+.5)[1]});order.sort((a,b)=>a.depth-b.depth);
for(const {x,y} of order){let c=cells[y*N+x],i=y*N+x;out+=cellShape(x,y,0,c.base?'#8c9290':'#658669', 'data-cell="'+i+'"');if(c.floor)out+=cellShape(x,y,.16,'#d5bda0','data-cell="'+i+'"');if(c.wall){out+=block(x,y,.2,2.2,'#e2ded0');if(c.window)out+=poly([[x+.2,y,1.1],[x+.8,y,1.1],[x+.8,y,2],[x+.2,y,2]],'#56b5ce');if(c.door)out+=poly([[x+.2,y,.2],[x+.8,y,.2],[x+.8,y,1.85],[x+.2,y,1.85]],'#7b5136')}out+=cellShape(x,y,.02,'transparent','data-cell="'+i+'"')}
if(roof)out+=poly([[0,0,3],[10,0,3],[10,10,3],[0,10,3]],'#435e6a','opacity=".82"');out+='<text x="22" y="36" fill="#e8f5f4" font-size="20">DOMUSCRAFT · Construção livre</text>';$('scene').innerHTML=out;let counts={};for(let k of ['base','floor','wall','door','window'])counts[k]=cells.filter(c=>c[k]).length;$('status').innerHTML='<b>Orçamento simulado: '+money.toLocaleString('pt-PT')+' €</b><br>Fundações: '+counts.base+' módulos<br>Pavimentos: '+counts.floor+' módulos<br>Paredes: '+counts.wall+' módulos<br>Portas: '+counts.door+' · Janelas: '+counts.window+'<br>Cobertura: '+(roof?'Sim':'Não');$('info').textContent=labels[tool]+' · Arrastar para rodar'}
function apply(i){if(i<0||i>=cells.length)return;snapshot();let c=cells[i];if(tool==='remove'){cells[i]={base:false,wall:false,door:false,window:false,floor:false}}else if(tool==='foundation'){c.base=true}else if(tool==='floor'){c.base=true;c.floor=true}else if(tool==='wall'){c.base=true;c.wall=true;c.door=false;c.window=false}else if(tool==='door'){c.base=true;c.wall=true;c.door=true;c.window=false}else if(tool==='window'){c.base=true;c.wall=true;c.window=true;c.door=false}money=cells.reduce((s,c)=>s+(c.base?600:0)+(c.floor?120:0)+(c.wall?480:0)+(c.door?780:0)+(c.window?650:0),0)+(roof?7000:0);render()}
for(const [key,label] of Object.entries(labels)){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{tool=key;document.querySelectorAll('.tools button').forEach(b=>b.classList.toggle('active',b===event.currentTarget));render()};b.classList.toggle('active',key===tool);$('tools').appendChild(b)}
$('scene').addEventListener('pointerdown',e=>{drag={x:e.clientX,angle,moved:false,cell:e.target.getAttribute('data-cell')};$('scene').setPointerCapture(e.pointerId)});$('scene').addEventListener('pointermove',e=>{if(!drag)return;let dx=e.clientX-drag.x;if(Math.abs(dx)>9)drag.moved=true;if(drag.moved){angle=drag.angle+dx*.35;render()}});$('scene').addEventListener('pointerup',()=>{if(drag&&!drag.moved&&drag.cell!==null)apply(+drag.cell);drag=null});$('scene').addEventListener('pointercancel',()=>drag=null);
$('starter').onclick=()=>{snapshot();cells=Array.from({length:N*N},()=>({base:false,wall:false,door:false,window:false,floor:false}));let t=+$('typ').value,w=Math.min(9,3+t*2),d=Math.min(8,3+t);for(let y=1;y<=d;y++)for(let x=1;x<=w;x++){let c=cells[y*N+x];c.base=true;c.floor=true;if(x===1||x===w||y===1||y===d)c.wall=true}cells[(d)*N+Math.round(w/2)].door=true;cells[(d)*N+Math.round(w/2)].wall=true;roof=false;money=cells.reduce((s,c)=>s+(c.base?600:0)+(c.floor?120:0)+(c.wall?480:0)+(c.door?780:0),0);render()};
$('roof').onclick=()=>{snapshot();roof=!roof;money+=roof?7000:-7000;render()};$('undo').onclick=()=>{if(history.length){let s=JSON.parse(history.pop());cells=s.cells;roof=s.roof;money=s.money;render()}};$('reset').onclick=()=>{if(confirm('Começar um novo terreno?')){snapshot();cells=Array.from({length:N*N},()=>({base:false,wall:false,door:false,window:false,floor:false}));roof=false;money=0;render()}};$('save').onclick=()=>{try{localStorage.setItem('domuscraft-v2',JSON.stringify({cells,roof,money,angle}));alert('Projeto guardado neste dispositivo.')}catch(e){alert('Não foi possível guardar.')}};try{let s=JSON.parse(localStorage.getItem('domuscraft-v2'));if(s&&s.cells?.length===100){cells=s.cells;roof=s.roof;money=s.money;angle=s.angle||0}}catch(e){}render();
</script></body></html>
