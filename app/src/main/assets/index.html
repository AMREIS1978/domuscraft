*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font:14px system-ui;background:#101b25;color:#f5f8fb}#view{position:fixed;inset:0;touch-action:none}canvas{display:block}button,input,select{font:inherit}button{background:#213e4e;border:1px solid #4b6c7b;color:#fff;padding:11px;border-radius:11px;cursor:pointer}button.active{background:#078b80;border-color:#61e5ce}button:active{opacity:.75}#top{position:fixed;top:0;left:0;right:0;padding:12px;display:flex;align-items:center;gap:9px;background:linear-gradient(#091722e8,#09172200);pointer-events:none}#top>*{pointer-events:auto}.brand{font-size:19px;font-weight:900;letter-spacing:1px}.brand em{font-style:normal;color:#59dfbd}#online{background:#133e38;border:1px solid #2f796c;border-radius:20px;padding:7px 10px;font-size:11px}#budget{margin-left:auto;font-weight:700;background:#122632c9;padding:10px;border-radius:10px}#toolbar{position:fixed;bottom:calc(8px + env(safe-area-inset-bottom,0px));left:8px;right:8px;display:flex;gap:7px;padding:9px;border-radius:16px;background:#0d202ce8;width:auto;max-width:none;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;z-index:6;box-shadow:0 12px 40px #0008}#toolbar button{min-width:85px;flex:0 0 auto;white-space:nowrap}#toolbar button:last-child{margin-right:12px}#edit{position:fixed;left:12px;bottom:calc(91px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:7;background:#0b202de9;padding:7px;border-radius:12px}#edit button{font-size:12px;padding:9px}#edit button.active{background:#078b80}#selection{position:fixed;left:12px;top:68px;background:#153b45dd;padding:9px;border-radius:9px;font-size:12px;z-index:5;display:none}#side{position:fixed;right:12px;top:70px;display:grid;gap:7px;width:142px}#side button{background:#112937e6}#hint{position:fixed;left:12px;bottom:calc(150px + env(safe-area-inset-bottom,0px));background:#0b2231c9;padding:10px;border-radius:9px;font-size:12px;max-width:270px}#panel{position:fixed;left:12px;top:68px;width:min(310px,calc(100vw - 24px));background:#0b202deb;border:1px solid #446171;border-radius:15px;padding:14px;box-shadow:0 15px 40px #0008;display:none}#panel.open{display:block}#panel label{display:block;margin:9px 0 4px}#panel input,#panel select{width:100%;padding:10px;border-radius:8px;background:#1e3c4c;color:white;border:1px solid #547284}#panel .actions{display:flex;gap:6px;margin-top:10px}#panel .actions button{flex:1}#toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#173b43;padding:10px 16px;border-radius:9px;display:none;max-width:85vw;text-align:center}#loading{position:fixed;inset:0;display:grid;place-content:center;text-align:center;background:#102331;z-index:20}#loading h2{margin-bottom:3px}@media(max-width:650px){#side{top:66px;right:7px;width:105px}#side button{font-size:12px;padding:8px 3px}#top{padding:8px}.brand{font-size:15px}#budget{font-size:11px;padding:8px}#toolbar{bottom:calc(5px + env(safe-area-inset-bottom,0px));padding:6px}#toolbar button{min-width:72px;font-size:12px;padding:9px 5px}#hint{bottom:calc(146px + env(safe-area-inset-bottom,0px));font-size:11px;max-width:200px}#edit{bottom:calc(76px + env(safe-area-inset-bottom,0px));left:6px;right:6px;overflow-x:auto}#edit button{flex:0 0 auto}}
</style></head><body><div id="view"></div><div id="loading"><h2>DOMUSCRAFT <span style="color:#5ce4bd">ONLINE</span></h2><p>A preparar o estaleiro 3D…</p></div><div id="top"><div class="brand">DOMUS<em>CRAFT</em></div><div id="online">● A ligar</div><button id="menu">☰ Projeto</button><div id="budget">0 €</div></div><div id="panel"><strong>PROJETO DE CONSTRUÇÃO</strong><label>Nome do projeto</label><input id="projectName" value="A minha casa"><label>Tipologia</label><select id="type"><option>T1</option><option selected>T2</option><option>T3</option><option>T4</option></select><div class="actions"><button id="starter">Criar casa</button><button id="save">Guardar</button></div><div class="actions"><button id="load">Abrir</button><button id="reset">Novo terreno</button></div><label>Localização / meteorologia online</label><div class="actions"><button id="weather">Clima real</button><button id="close">Fechar</button></div><small id="weatherResult">O clima usa Open-Meteo, sem chave de API. A localização é opcional.</small></div><div id="side"><button id="orbit">↻ Rodar</button><button id="zoomIn">＋ Zoom</button><button id="zoomOut">－ Zoom</button><button id="undo">↶ Desfazer</button><button id="roof">⌂ Cobertura</button></div><div id="hint">Toca no terreno para construir · Arrasta para rodar · Dois dedos para ampliar</div><div id="selection"></div><div id="edit"><button id="selectMode" class="active">☝ Selecionar</button><button id="buildMode">＋ Construir</button><button id="rotatePart">⤾ Rodar peça</button><button id="movePart">✥ Mover</button><button id="deletePart">⌫ Apagar</button></div><div id="toolbar"></div><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.min.js"></script><script>
(function(){'use strict';const $=id=>document.getElementById(id),GRID=22,COST={Fundação:650,Pavimento:130,Parede:510,Porta:820,Janela:690,Árvore:95,Remover:0};let selected='Parede',mode='select',activeKey=null,movePending=false,cells=new Map(),history=[],roof=false,yaw=.7,dist=31,tilt=.82,down=null,budget=0,roofObj=null,gridObjects=[],ground;const toast=s=>{let t=$('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};if(!window.THREE){$('loading').innerHTML='<h2>Sem ligação ao motor 3D</h2><p>Ative a Internet e volte a abrir o jogo.</p>';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9bc4df);scene.fog=new THREE.Fog(0x9bc4df,36,95);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;$('view').appendChild(renderer.domElement);const camera=new THREE.PerspectiveCamera(52,innerWidth/innerHeight,.1,180);scene.add(new THREE.HemisphereLight(0xffffff,0x66835f,2));let sun=new THREE.DirectionalLight(0xfff5db,2.4);sun.position.set(14,27,13);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-27;sun.shadow.camera.right=27;sun.shadow.camera.top=27;sun.shadow.camera.bottom=-27;scene.add(sun);
const mats={ground:new THREE.MeshStandardMaterial({color:0x638b62,roughness:1}),foundation:new THREE.MeshStandardMaterial({color:0x9ca4a5,roughness:.9}),floor:new THREE.MeshStandardMaterial({color:0xb9956e,roughness:.8}),wall:new THREE.MeshStandardMaterial({color:0xe6dfd1,roughness:.87}),door:new THREE.MeshStandardMaterial({color:0x875a38,roughness:.6}),glass:new THREE.MeshStandardMaterial({color:0x65b7d4,metalness:.25,roughness:.15,transparent:true,opacity:.8}),roof:new THREE.MeshStandardMaterial({color:0x384f59,roughness:.9}),wood:new THREE.MeshStandardMaterial({color:0x75543c}),leaf:new THREE.MeshStandardMaterial({color:0x4b8750})};function cube(parent,x,y,z,w,h,d,mat){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mats[mat]);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}
ground=cube(scene,0,-.16,0,GRID+.8,.3,GRID+.8,'ground');ground.userData.ground=true;let grid=new THREE.GridHelper(GRID,GRID,0xb5c5a6,0x87a581);grid.position.y=.008;scene.add(grid);const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
function updateCamera(){camera.position.set(Math.sin(yaw)*Math.cos(tilt)*dist,Math.sin(tilt)*dist,Math.cos(yaw)*Math.cos(tilt)*dist);camera.lookAt(0,0,0)}updateCamera();function key(x,z){return x+','+z}function cost(){budget=[...cells.values()].reduce((s,c)=>s+COST[c.kind],0)+(roof?8200:0);$('budget').textContent=budget.toLocaleString('pt-PT')+' €'}function put(x,z,kind,remember=true){if(remember)history.push(serialize());const k=key(x,z),old=cells.get(k);if(old){scene.remove(old.group);cells.delete(k)}if(kind!=='Remover'){let g=new THREE.Group();g.position.set(x-GRID/2+.5,0,z-GRID/2+.5);scene.add(g);if(kind==='Fundação')cube(g,0,.16,0,.98,.32,.98,'foundation');if(kind==='Pavimento')cube(g,0,.1,0,.98,.2,.98,'floor');if(kind==='Parede')cube(g,0,1.43,0,.98,2.86,.22,'wall');if(kind==='Porta'){cube(g,-.4,1.43,0,.18,2.86,.23,'wall');cube(g,.4,1.43,0,.18,2.86,.23,'wall');cube(g,0,2.6,0,.98,.52,.23,'wall');cube(g,0,1.15,0,.62,2.3,.12,'door');cube(g,.21,1.15,.1,.035,.07,.035,'foundation')}if(kind==='Janela'){cube(g,0,.5,0,.98,1,.23,'wall');cube(g,0,2.48,0,.98,.75,.23,'wall');cube(g,0,1.55,0,.8,1.16,.12,'glass');cube(g,0,1.55,.09,.06,1.16,.06,'wall')}if(kind==='Árvore'){let trunk=new THREE.Mesh(new THREE.CylinderGeometry(.14,.2,2.2,7),mats.wood);trunk.position.y=1.1;g.add(trunk);let foliage=new THREE.Mesh(new THREE.ConeGeometry(1.15,3,9),mats.leaf);foliage.position.y=3.1;g.add(foliage)}g.userData.partKey=k;cells.set(k,{x,z,kind,group:g,rotation:0})}cost()}
function serialize(){return {name:$('projectName').value,type:$('type').value,roof,parts:[...cells.values()].map(({x,z,kind,rotation})=>({x,z,kind,rotation:rotation||0}))}}function restore(s){for(let c of cells.values())scene.remove(c.group);cells.clear();roof=false;setRoof(false);$('projectName').value=s.name||'A minha casa';$('type').value=s.type||'T2';for(let c of s.parts||[]){put(c.x,c.z,c.kind,false);let part=cells.get(key(c.x,c.z));if(part){part.rotation=c.rotation||0;part.group.rotation.y=part.rotation}}activeKey=null;setRoof(!!s.roof);cost()}
function setRoof(v){roof=v;if(roofObj){scene.remove(roofObj);roofObj=null}if(roof){roofObj=new THREE.Group();let positions=[...cells.values()].filter(c=>['Parede','Porta','Janela'].includes(c.kind));if(positions.length){let minX=Math.min(...positions.map(c=>c.x))-GRID/2,maxX=Math.max(...positions.map(c=>c.x))-GRID/2+1,minZ=Math.min(...positions.map(c=>c.z))-GRID/2,maxZ=Math.max(...positions.map(c=>c.z))-GRID/2+1;cube(roofObj,(minX+maxX)/2,3.1,(minZ+maxZ)/2,maxX-minX+.5,.25,maxZ-minZ+.5,'roof');scene.add(roofObj)}}cost()}
const buttons=$('toolbar');for(let kind of Object.keys(COST)){let b=document.createElement('button');b.textContent=({Fundação:'▤',Pavimento:'▦',Parede:'▥',Porta:'🚪',Janela:'▣',Árvore:'🌳',Remover:'⌫'}[kind])+' '+kind;b.className=kind===selected?'active':'';b.onclick=()=>{selected=kind;setMode('build');for(let el of buttons.children)el.classList.toggle('active',el===b);$('hint').textContent=kind+' selecionado · Toque no terreno para aplicar'};buttons.appendChild(b)}
function setMode(v){mode=v;movePending=false;$('selectMode').classList.toggle('active',v==='select');$('buildMode').classList.toggle('active',v==='build');$('movePart').classList.toggle('active',v==='move');$('hint').textContent=v==='select'?'Toque numa peça para selecionar; arraste para rodar a vista':v==='move'?'Toque no destino livre da peça selecionada':'Toque no terreno para construir '+selected}
function selectPart(k){activeKey=k;for(let [id,p] of cells){p.group.traverse(o=>{if(o.isMesh&&o.material&&o.material.emissive)o.material.emissive.setHex(0)})}let p=cells.get(k);if(!p){$('selection').style.display='none';return}let box=$('selection');box.style.display='block';box.textContent='Selecionado: '+p.kind+' · módulo '+(p.x+1)+','+(p.z+1);toast('Peça selecionada: '+p.kind)}
function pick(e){let rect=renderer.domElement.getBoundingClientRect();pointer.set((e.clientX-rect.left)/rect.width*2-1,-(e.clientY-rect.top)/rect.height*2+1);raycaster.setFromCamera(pointer,camera);let hits=raycaster.intersectObjects([...cells.values()].map(c=>c.group),true);let hitPart=null;for(let hit of hits){let obj=hit.object;while(obj&&!obj.userData.partKey)obj=obj.parent;if(obj&&obj.userData.partKey){hitPart=obj.userData.partKey;break}}let floor=raycaster.intersectObject(ground);let cell=null;if(floor.length){let p=floor[0].point,x=Math.floor(p.x+GRID/2),z=Math.floor(p.z+GRID/2);if(x>=0&&x<GRID&&z>=0&&z<GRID)cell={x,z,k:key(x,z)}}return {hitPart,cell}}
function locate(e){let result=pick(e);if(mode==='move'&&activeKey&&result.cell){let p=cells.get(activeKey);if(!p)return;if(cells.has(result.cell.k)){toast('Posição ocupada');return}history.push(serialize());cells.delete(activeKey);p.x=result.cell.x;p.z=result.cell.z;p.group.position.set(p.x-GRID/2+.5,0,p.z-GRID/2+.5);cells.set(result.cell.k,p);selectPart(result.cell.k);setRoof(roof);return}if(mode==='select'){if(result.hitPart)selectPart(result.hitPart);else if(result.cell&&cells.has(result.cell.k))selectPart(result.cell.k);else{activeKey=null;$('selection').style.display='none'}return}if(result.cell){put(result.cell.x,result.cell.z,selected);selectPart(result.cell.k)}}
$('selectMode').onclick=()=>setMode('select');$('buildMode').onclick=()=>setMode('build');$('movePart').onclick=()=>{if(!activeKey){toast('Selecione primeiro uma peça');return}setMode('move')};$('rotatePart').onclick=()=>{let p=cells.get(activeKey);if(!p){toast('Toque primeiro numa peça');return}history.push(serialize());p.rotation=(p.rotation||0)+Math.PI/2;p.group.rotation.y=p.rotation;toast('Peça rodada 90°')};$('deletePart').onclick=()=>{let p=cells.get(activeKey);if(!p){toast('Selecione primeiro uma peça');return}put(p.x,p.z,'Remover');activeKey=null;$('selection').style.display='none'};
renderer.domElement.addEventListener('pointerdown',e=>{down={startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(e.clientX-down.startX,e.clientY-down.startY)>10)down.moved=true;if(down.moved){yaw-=dx*.007;tilt=Math.max(.25,Math.min(1.32,tilt+dy*.005));updateCamera()}down.x=e.clientX;down.y=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(down&&!down.moved)locate(e);down=null});renderer.domElement.addEventListener('pointercancel',()=>down=null);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(10,Math.min(65,dist+e.deltaY*.025));updateCamera()},{passive:true});$('zoomIn').onclick=()=>{dist=Math.max(10,dist*.8);updateCamera()};$('zoomOut').onclick=()=>{dist=Math.min(65,dist*1.2);updateCamera()};$('orbit').onclick=()=>{yaw+=.4;updateCamera()};$('undo').onclick=()=>{let s=history.pop();if(s){restore(s);setMode('select')}};$('roof').onclick=()=>{history.push(serialize());setRoof(!roof)};$('menu').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');
$('starter').onclick=()=>{history.push(serialize());let n=parseInt($('type').value.slice(1)),w=5+n*2,d=4+n;restore({name:$('projectName').value,type:$('type').value,roof:false,parts:[]});let startX=Math.floor((GRID-w)/2),startZ=Math.floor((GRID-d)/2);for(let x=0;x<w;x++)for(let z=0;z<d;z++){let kind=(x===0||z===0||x===w-1||z===d-1)?'Parede':'Pavimento';if(z===d-1&&x===Math.floor(w/2))kind='Porta';else if(z===d-1&&x===2)kind='Janela';put(startX+x,startZ+z,kind,false)}setRoof(true);$('panel').classList.remove('open');toast('Casa '+$('type').value+' criada — já pode editar cada elemento')};
$('save').onclick=()=>{try{localStorage.setItem('domuscraft-online-v3',JSON.stringify(serialize()));toast('Projeto guardado neste dispositivo')}catch(e){toast('Não foi possível guardar')}};$('load').onclick=()=>{let s=localStorage.getItem('domuscraft-online-v3');if(s){restore(JSON.parse(s));toast('Projeto carregado')}else toast('Ainda não existe projeto guardado')};$('reset').onclick=()=>{if(confirm('Limpar o terreno?')){history.push(serialize());restore({parts:[],roof:false});toast('Novo terreno preparado')}};
$('weather').onclick=()=>{let result=$('weatherResult');result.textContent='A obter localização…';if(!navigator.geolocation){result.textContent='Localização indisponível';return}navigator.geolocation.getCurrentPosition(async pos=>{try{let {latitude,longitude}=pos.coords;let url='https://api.open-meteo.com/v1/forecast?latitude='+latitude+'&longitude='+longitude+'&current=temperature_2m,wind_speed_10m&timezone=auto';let r=await fetch(url),d=await r.json();result.textContent='Clima real: '+d.current.temperature_2m+' °C · Vento '+d.current.wind_speed_10m+' km/h · Open-Meteo'}catch(e){result.textContent='Sem acesso ao serviço meteorológico'}},()=>result.textContent='Localização não autorizada')};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();$('loading').remove();$('online').textContent='● 3D online';try{let s=localStorage.getItem('domuscraft-online-v3');if(s)restore(JSON.parse(s))}catch(e){}cost();
