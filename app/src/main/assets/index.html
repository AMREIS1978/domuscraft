<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DOMUSCRAFT — Build Your Dream Home</title><style>body{margin:0;background:#101b24;color:#eaf3f7;font:15px system-ui}header{padding:16px 22px;background:#172a37;display:flex;justify-content:space-between;align-items:center}h1{font-size:20px;margin:0}main{display:grid;grid-template-columns:270px 1fr;min-height:calc(100vh - 70px)}aside{padding:18px;background:#1a2d3a}label{display:block;margin:14px 0 6px}select,button,input{width:100%;padding:10px;border-radius:8px;border:1px solid #49606d;background:#243e4d;color:white;box-sizing:border-box}button{margin-top:12px;cursor:pointer;background:#168b81;border:0;font-weight:bold}button.secondary{background:#365466}#view{display:grid;place-items:center;overflow:hidden;touch-action:none}svg{width:min(95%,950px);height:auto;max-height:80vh}#stats{line-height:1.9;margin-top:18px}small{color:#aac0c9}@media(max-width:720px){main{grid-template-columns:1fr}aside{order:2}#view{min-height:370px}}</style></head><body><header><h1>DOMUSCRAFT <span style="color:#56d5c6">BUILD YOUR DREAM HOME</span></h1><small>Protótipo 0.1</small></header><main><aside><label>Tipologia</label><select id="type"><option value="1">T1 · 65 m²</option><option value="2" selected>T2 · 90 m²</option><option value="3">T3 · 120 m²</option><option value="4">T4 · 150 m²</option></select><label>Modo</label><select id="mode"><option value="auto">Construção automática</option><option value="manual">Construção manual por etapas</option></select><button id="build">Gerar casa</button><button id="next" class="secondary">Avançar etapa</button><button id="reset" class="secondary">Recomeçar</button><button id="save" class="secondary">Guardar projeto</button><div id="stats"></div><small>Arraste a casa para rodar. Os valores são apenas estimativas ilustrativas.</small></aside><div id="view"><svg id="scene" viewBox="0 0 900 650" aria-label="Modelo tridimensional ilustrativo da casa"></svg></div></main><script>
const $=id=>document.getElementById(id);let stage=0,angle=0,typ=2;const stages=['Terreno','Fundações','Pavimento','Paredes','Cobertura','Portas e janelas','Concluída'];function poly(points,fill,stroke='#31444c'){return `<polygon points="${points.map(p=>p.join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="2" stroke-linejoin="round"/>`};function project(x,y,z){let a=(angle+35)*Math.PI/180,c=Math.cos(a),s=Math.sin(a);return [450+(x*c-y*s)*3.4,340+(x*s+y*c)*1.65-z*3.3]};function face(ps,col){return poly(ps.map(p=>project(...p)),col)}function render(){let area=[0,65,90,120,150][typ],w=Math.sqrt(area)*1.45,d=area/w,h=9;let parts=[];parts.push(face([[-65,-65,-.5],[65,-65,-.5],[65,65,-.5],[-65,65,-.5]],'#426d55'));parts.push(face([[-w/2-2,-d/2-2,0],[w/2+2,-d/2-2,0],[w/2+2,d/2+2,0],[-w/2-2,d/2+2,0]],'#b8a78a'));if(stage>=1)parts.push(face([[-w/2,-d/2,1],[w/2,-d/2,1],[w/2,d/2,1],[-w/2,d/2,1]],'#7d8586'));if(stage>=2)parts.push(face([[-w/2,-d/2,1.5],[w/2,-d/2,1.5],[w/2,d/2,1.5],[-w/2,d/2,1.5]],'#d9cbb2'));if(stage>=3){parts.push(face([[-w/2,-d/2,1.5],[w/2,-d/2,1.5],[w/2,-d/2,h],[-w/2,-d/2,h]],'#e2e2d6'));parts.push(face([[w/2,-d/2,1.5],[w/2,d/2,1.5],[w/2,d/2,h],[w/2,-d/2,h]],'#b9c7c5'));parts.push(face([[-w/2,d/2,1.5],[w/2,d/2,1.5],[w/2,d/2,h],[-w/2,d/2,h]],'#c9d2cf'));parts.push(face([[-w/2,-d/2,1.5],[-w/2,d/2,1.5],[-w/2,d/2,h],[-w/2,-d/2,h]],'#eef0e6'))}if(stage>=4){parts.push(face([[-w/2-1,-d/2-1,h],[w/2+1,-d/2-1,h],[0,-d/2-1,h+5]],'#455c66'));parts.push(face([[-w/2-1,d/2+1,h],[w/2+1,d/2+1,h],[0,d/2+1,h+5]],'#455c66'));parts.push(face([[0,-d/2-1,h+5],[0,d/2+1,h+5],[w/2+1,d/2+1,h],[w/2+1,-d/2-1,h]],'#334c57'));parts.push(face([[-w/2-1,-d/2-1,h],[-w/2-1,d/2+1,h],[0,d/2+1,h+5],[0,-d/2-1,h+5]],'#58727d'))}if(stage>=5){parts.push(face([[-w/2*.65,-d/2-.05,1.5],[-w/2*.15,-d/2-.05,1.5],[-w/2*.15,-d/2-.05,6],[-w/2*.65,-d/2-.05,6]],'#385e74'));parts.push(face([[w/2*.3,-d/2-.05,1.5],[w/2*.65,-d/2-.05,1.5],[w/2*.65,-d/2-.05,7],[w/2*.3,-d/2-.05,7]],'#755d43'))} $('scene').innerHTML=`<rect width="900" height="650" fill="#13222d"/><ellipse cx="450" cy="450" rx="280" ry="100" fill="#0c1921" opacity=".6"/>${parts.join('')}<text x="24" y="38" fill="#e8f4f7" font-size="23" font-family="system-ui">${stages[stage]}</text>`;$('stats').innerHTML=`<b>Projeto T${typ}</b><br>Área: ${area} m²<br>Etapa: ${stage+1}/7<br>Orçamento estimado: ${(area*1450).toLocaleString('pt-PT')} €<br>Executado (simulado): ${Math.round(stage/6*100)}%`};$('build').onclick=()=>{typ=+$('type').value;stage=$('mode').value==='auto'?6:0;render()};$('next').onclick=()=>{stage=Math.min(6,stage+1);render()};$('reset').onclick=()=>{stage=0;render()};$('save').onclick=()=>{let data={tipologia:typ,etapa:stage,rotacao:angle,versao:'0.1'},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='domuscraft-projeto.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};let start=null;$('scene').addEventListener('pointerdown',e=>{start=e.clientX;$('scene').setPointerCapture(e.pointerId)});$('scene').addEventListener('pointermove',e=>{if(start!==null){angle+=(e.clientX-start)*.35;start=e.clientX;render()}});$('scene').addEventListener('pointerup',()=>start=null);render();</script></body></html>
