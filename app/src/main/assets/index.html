if(!r.cell)return;let target=r.cell;if((selected==='Janela'||selected==='Porta')&&r.hitPart){let p=getPart(r.hitPart);if(p&&!p.layer)target={x:p.x,z:p.z,k:key(p.x,p.z)}}if(put(target.x,target.z,selected)!==false){selectPart((selected==='Relva'||selected==='Pavimento'||selected==='Fundação')?'s:'+target.k:selected==='Árvore'?'t:'+target.k:target.k)}}
$('selectMode').onclick=()=>setMode('select');$('buildMode').onclick=()=>setMode('build');$('movePart').onclick=()=>{if(!getPart(activeKey)){toast('Selecione primeiro uma peça');return}setMode('move')};$('rotatePart').onclick=()=>{let p=getPart(activeKey);if(!p){toast('Toque primeiro numa peça');return}history.push(serialize());p.rotation=(p.rotation||0)+Math.PI/2;p.group.rotation.y=p.rotation;if(!p.layer){p.autoOrient=false}selectPart(activeKey);toast('Peça rodada 90°')};$('deletePart').onclick=()=>{let p=getPart(activeKey);if(!p){toast('Selecione primeiro uma peça');return}history.push(serialize());removeAt(key(p.x,p.z),p.layer||'structure');activeKey=null;clearSelection()};
renderer.domElement.addEventListener('pointerdown',e=>{down={startX:e.clientX,startY:e.clientY,x:e.clientX,y:e.clientY,moved:false};renderer.domElement.setPointerCapture(e.pointerId)});renderer.domElement.addEventListener('pointermove',e=>{if(!down)return;let dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.hypot(e.clientX-down.startX,e.clientY-down.startY)>10)down.moved=true;if(down.moved){yaw-=dx*.007;tilt=Math.max(.25,Math.min(1.32,tilt+dy*.005));updateCamera()}down.x=e.clientX;down.y=e.clientY});renderer.domElement.addEventListener('pointerup',e=>{if(down&&!down.moved)locate(e);down=null});renderer.domElement.addEventListener('pointercancel',()=>down=null);renderer.domElement.addEventListener('wheel',e=>{dist=Math.max(10,Math.min(65,dist+e.deltaY*.025));updateCamera()},{passive:true});$('zoomIn').onclick=()=>{dist=Math.max(10,dist*.8);updateCamera()};$('zoomOut').onclick=()=>{dist=Math.min(65,dist*1.2);updateCamera()};$('orbit').onclick=()=>{yaw+=.4;updateCamera()};$('undo').onclick=()=>{let s=history.pop();if(s){restore(s);setMode('select')}};$('roof').onclick=()=>{history.push(serialize());setRoof(!roof)};$('menu').onclick=()=>$('panel').classList.toggle('open');$('close').onclick=()=>$('panel').classList.remove('open');
$('starter').onclick=()=>{history.push(serialize());let n=parseInt($('type').value.slice(1)),w=5+n*2,d=4+n;restore({name:$('projectName').value,type:$('type').value,roof:false,parts:[]});let startX=Math.floor((GRID-w)/2),startZ=Math.floor((GRID-d)/2);for(let x=0;x<w;x++)for(let z=0;z<d;z++){addFloor(startX+x,startZ+z,'Pavimento');let kind=(x===0||z===0||x===w-1||z===d-1)?'Parede':'Pavimento';if(z===d-1&&x===Math.floor(w/2))kind='Porta';else if(z===d-1&&x===2)kind='Janela';if(kind==='Porta'||kind==='Janela')put(startX+x,startZ+z,'Parede',false);put(startX+x,startZ+z,kind,false)}setRoof(true);$('panel').classList.remove('open');toast('Casa '+$('type').value+' criada — já pode editar cada elemento')};
$('save').onclick=()=>{try{localStorage.setItem('domuscraft-online-v3',JSON.stringify(serialize()));toast('Projeto guardado neste dispositivo')}catch(e){toast('Não foi possível guardar')}};$('load').onclick=()=>{let s=localStorage.getItem('domuscraft-online-v3');if(s){restore(JSON.parse(s));toast('Projeto carregado')}else toast('Ainda não existe projeto guardado')};$('reset').onclick=()=>{if(confirm('Limpar o terreno?')){history.push(serialize());restore({parts:[],roof:false});toast('Novo terreno preparado')}};
$('weather').onclick=()=>{let result=$('weatherResult');result.textContent='A obter localização…';if(!navigator.geolocation){result.textContent='Localização indisponível';return}navigator.geolocation.getCurrentPosition(async pos=>{try{let {latitude,longitude}=pos.coords;let url='https://api.open-meteo.com/v1/forecast?latitude='+latitude+'&longitude='+longitude+'&current=temperature_2m,wind_speed_10m&timezone=auto';let r=await fetch(url),d=await r.json();result.textContent='Clima real: '+d.current.temperature_2m+' °C · Vento '+d.current.wind_speed_10m+' km/h · Open-Meteo'}catch(e){result.textContent='Sem acesso ao serviço meteorológico'}},()=>result.textContent='Localização não autorizada')};
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function animate(){requestAnimationFrame(animate);renderer.render(scene,camera)}animate();$('loading').remove();$('online').textContent='● 3D online';try{let s=localStorage.getItem('domuscraft-online-v3');if(s)restore(JSON.parse(s))}catch(e){}cost();
})();
