name: Gerar DOMUSCRAFT APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verificar Android SDK preinstalado
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Instalar SDK Android 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DOMUSCRAFT-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
